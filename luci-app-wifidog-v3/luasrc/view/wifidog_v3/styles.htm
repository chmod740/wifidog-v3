<style>
body[data-page^="admin-services-wifidog_v3"] {

body[data-page^="admin-services-wifidog_v3"] #maincontent.container {

}

.wifidog-shell,
.wifidog-shell *,
.wifidog-shell *::before,
.wifidog-shell *::after,

body[data-page^="admin-services-wifidog_v3"] h1,
body[data-page^="admin-services-wifidog_v3"] h2,
body[data-page^="admin-services-wifidog_v3"] h3,

	overflow-wrap: normal;

.wifidog-shell {
	display: grid;
	gap: 1.25rem;
	width: 100%;
	max-width: 1280px;
	margin: 0 auto;
	color: inherit;
}

.wifidog-page-head {
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: 1.5rem;

}

.wifidog-page-head-main {
	min-width: 0;
}

.wifidog-page-kicker {

.wifidog-page-title {

.wifidog-panel {

}

.wifidog-panel-head {
	display: flex;
	align-items: center;
	justify-content: space-between;

	padding: 1rem 1.15rem;

.wifidog-panel-title {

.wifidog-panel-copy {

.wifidog-panel-foot {

}

.wifidog-page-hint {

}

.wifidog-count,

	align-items: center;

.wifidog-count {

}

.wifidog-badge-ok {
	border-color: rgba(22, 131, 58, .28);
	background: rgba(22, 131, 58, .11);
	color: #12662f;
}

.wifidog-badge-error {
	border-color: rgba(197, 45, 47, .28);
	background: rgba(197, 45, 47, .11);
	color: #9d2022;
}

.wifidog-badge-info {
	border-color: rgba(39, 130, 196, .28);
	background: rgba(39, 130, 196, .11);
	color: #216b9e;
}

.wifidog-badge-warning {
	border-color: rgba(183, 104, 0, .3);
	background: rgba(183, 104, 0, .12);
	color: #8a4e00;
}

.wifidog-table-wrap {
	width: 100%;
	overflow-x: auto;
	background: transparent;
}

.wifidog-table {
	width: 100%;
	min-width: 760px;
	border-collapse: separate;
	border-spacing: 0;
	margin: 0;
}

.wifidog-table th {
	padding: .72rem .65rem;
	border-bottom: 1px solid var(--wd-border);
	background: var(--wd-surface-soft);
	color: var(--wd-muted);
	font-size: .76rem;
	font-weight: 700;
	line-height: 1.3;
	text-align: left;
	white-space: nowrap;
}

.wifidog-table td {
	padding: .72rem .65rem;
	border-bottom: 1px solid var(--wd-border);
	color: inherit;
	font-size: .82rem;
	line-height: 1.4;
	vertical-align: middle;
}

.wifidog-table tbody tr:last-child td {
	border-bottom: 0;
}

.wifidog-table tbody tr:hover {
	background: var(--wd-surface-soft);
}

.wifidog-table td:first-child,
.wifidog-table td:nth-child(2) {
	font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	font-variant-numeric: tabular-nums;
}

.wifidog-actions {
	display: flex;
	flex-wrap: wrap;
	gap: .4rem;
	align-items: center;
}

td.wifidog-actions {

}

td.wifidog-actions .wifidog-btn {
	margin: .12rem .18rem .12rem 0;
}

.wifidog-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	min-height: 2.1rem;
	padding: .42rem .72rem;
	border: 1px solid var(--wd-border-strong);
	border-radius: 4px;
	background: var(--wd-surface-raised);
	color: inherit;
	cursor: pointer;
	font-size: .76rem;
	font-weight: 600;
	line-height: 1.2;
	text-decoration: none;
	white-space: nowrap;
	transition: background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;
}

.wifidog-btn:hover {
	background: var(--wd-surface-soft);
	border-color: var(--wd-border-strong);
}

.wifidog-btn:focus,
.wifidog-btn:focus-visible {
	outline: 0;
	box-shadow: 0 0 0 3px var(--wd-focus);
}

.wifidog-btn:disabled {
	opacity: .55;
	cursor: not-allowed;
}

.wifidog-btn-primary,
.wifidog-btn-info {
	background: var(--wd-primary);
	border-color: var(--wd-primary);
	color: #fff;
}

.wifidog-btn-primary:hover,
.wifidog-btn-info:hover {
	background: var(--wd-primary-hover);
	border-color: var(--wd-primary-hover);
	color: #fff;
}

.wifidog-btn-success {
	background: var(--wd-success);
	border-color: var(--wd-success);
	color: #fff;
}

.wifidog-btn-warning {
	background: var(--wd-warning);
	border-color: var(--wd-warning);
	color: #fff;
}

.wifidog-btn-danger {
	background: var(--wd-danger);
	border-color: var(--wd-danger);
	color: #fff;
}

.wifidog-btn-secondary {
	background: var(--wd-neutral);
	border-color: var(--wd-neutral);
	color: #fff;
}

.wifidog-btn-success:hover,
.wifidog-btn-warning:hover,
.wifidog-btn-danger:hover,
.wifidog-btn-secondary:hover {
	filter: brightness(.9);
	color: #fff;
}

.wifidog-note,
.wifidog-form-group input,
.wifidog-form-group select,
.wifidog-textarea,
.wifidog-log-toolbar select,
.wifidog-log-toolbar input {

	border: 1px solid var(--wd-border-strong);
	border-radius: 4px;
	background: var(--wd-surface-raised);
	color: inherit;
}

.wifidog-note {
	width: 11rem;
	max-width: 100%;
	min-height: 2.1rem;
	padding: .4rem .55rem;
}

.wifidog-note:focus,
.wifidog-form-group input:focus,
.wifidog-form-group select:focus,
.wifidog-textarea:focus,
.wifidog-log-toolbar select:focus,
.wifidog-log-toolbar input:focus {

}

.wifidog-note-dirty {
	border-color: var(--wd-warning);

}

.wifidog-device-info {
	max-width: 240px;
	color: inherit;
	font-size: .76rem;
	line-height: 1.45;
	word-break: break-word;
}

.wifidog-device-seen {
	margin-top: .2rem;
	color: var(--wd-muted);
}

.wifidog-empty,
.wifidog-loading {
	padding: 2rem 1rem;
	color: var(--wd-muted);
	font-size: .82rem;
	text-align: center;
}

.wifidog-empty {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: .2rem;
	min-height: 7rem;
	margin: .85rem;
	border: 1px dashed var(--wd-border-strong);
	border-radius: .55rem;
	background: var(--wd-surface-soft);
}

.wifidog-empty strong {
	color: inherit;
	font-size: .88rem;
}

.wifidog-msg {
	position: sticky;
	top: 8px;
	z-index: 20;
	display: none;
	padding: .75rem .9rem;
	border-radius: .5rem;
	box-shadow: var(--wd-shadow);
	font-size: .82rem;
	font-weight: 600;
	line-height: 1.45;
}

.wifidog-msg-success {
	border: 1px solid rgba(22, 131, 58, .42);
	background: rgba(22, 131, 58, .12);
	color: #12662f;
}

.wifidog-msg-error {
	border: 1px solid rgba(197, 45, 47, .42);
	background: rgba(197, 45, 47, .11);
	color: #9d2022;
}

.wifidog-generate-box {
	padding: 1.15rem;
}

.wifidog-generate-box h4 {
	margin: 0 0 .9rem;
	color: inherit;
}

.wifidog-form-grid {
	display: grid;
	grid-template-columns: repeat(2, minmax(15rem, 1fr));
	gap: .8rem 1.15rem;
}

.wifidog-form-group {
	display: grid;
	grid-template-columns: minmax(9.5rem, 12rem) minmax(9rem, 1fr);
	align-items: center;
	gap: .3rem .75rem;
	margin-bottom: .8rem;
}

.wifidog-form-group label {
	color: inherit;
	font-size: .82rem;
	font-weight: 600;
}

.wifidog-form-group input,
.wifidog-form-group select {
	width: 100%;
	min-height: 2.2rem;
	padding: .42rem .55rem;
	font-size: .82rem;
}

.wifidog-form-hint {
	grid-column: 2;
	margin: 0;
	color: var(--wd-muted);
	font-size: .76rem;
	line-height: 1.45;
}

.wifidog-backup-grid {
	display: grid;
	grid-template-columns: minmax(16rem, .72fr) minmax(22rem, 1.28fr);
	gap: 1.25rem;
}

.wifidog-backup-grid .wifidog-panel-body p {
	margin: 0 0 .9rem;
	color: var(--wd-muted);
	font-size: .82rem;
	line-height: 1.55;
}

.wifidog-checkline {
	display: flex;
	align-items: flex-start;
	gap: .5rem;
	margin: .9rem 0 .4rem;
	color: inherit;
	font-size: .82rem;
}

.wifidog-file {
	display: block;
	max-width: 100%;
	margin: .65rem 0;
}

.wifidog-textarea {
	width: 100%;
	min-height: 13rem;
	padding: .7rem;
	font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	font-size: .76rem;
	line-height: 1.55;
}

.wifidog-log-toolbar {
	display: flex;
	flex-wrap: wrap;
	align-items: end;
	gap: .65rem;
}

.wifidog-log-toolbar label {
	display: grid;
	gap: .3rem;
	min-width: 7.5rem;
	margin: 0;
	color: var(--wd-muted);
	font-size: .76rem;
	font-weight: 700;
}

.wifidog-log-toolbar label.wifidog-log-search {
	flex: 1 1 15rem;
}

.wifidog-log-toolbar select,
.wifidog-log-toolbar input {
	width: 100%;
	min-height: 2.2rem;
	padding: .35rem .55rem;
}

.wifidog-log-meta,
.wifidog-log-error {
	margin: 0;
	font-size: .76rem;
}

.wifidog-log-meta {
	color: var(--wd-muted);
}

.wifidog-log-error {
	color: var(--wd-danger);
}

.wifidog-log-output {
	min-height: 27rem;
	max-height: 68vh;
	overflow: auto;
	padding: .9rem;
	border-radius: 0 0 .7rem .7rem;
	background: #111827;
	color: #e5e7eb;
	font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	font-size: .76rem;
	line-height: 1.55;
	white-space: pre-wrap;
	word-break: break-word;
}

.wifidog-log-empty {
	color: #9ca3af;
}

.wifidog-log-source {
	margin-right: .5rem;
	color: #93c5fd;
}

.wifidog-state-banner {
	--wd-state: var(--wd-neutral);
	--wd-state-soft: rgba(104, 115, 134, .11);
	--wd-state-text: #4b5565;
	display: grid;
	grid-template-columns: auto minmax(0, 1fr);
	gap: 1rem;
	align-items: flex-start;
	padding: 1.2rem;
	border: 1px solid var(--wd-state);
	border-radius: .7rem;
	background: var(--wd-state-soft);
	box-shadow: var(--wd-shadow);
}

.wifidog-state-ok {
	--wd-state: var(--wd-success);
	--wd-state-soft: rgba(22, 131, 58, .11);
	--wd-state-text: #12662f;
}

.wifidog-state-error {
	--wd-state: var(--wd-danger);
	--wd-state-soft: rgba(197, 45, 47, .11);
	--wd-state-text: #9d2022;
}

.wifidog-state-disabled {
	--wd-state: var(--wd-neutral);
	--wd-state-soft: rgba(104, 115, 134, .11);
	--wd-state-text: #4b5565;
}

.wifidog-state-icon {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	width: 2.8rem;
	height: 2.8rem;
	border-radius: 999px;
	background: var(--wd-state);
	color: #fff;
	font-size: 1.45rem;
	font-weight: 800;
	line-height: 1;
}

.wifidog-state-copy {
	min-width: 0;
}

.wifidog-state-kicker {
	display: block;
	margin-bottom: .2rem;
	color: var(--wd-state-text);
	font-size: .72rem;
	font-weight: 800;
	line-height: 1.2;
}

.wifidog-state-copy h4 {
	margin: 0 0 .3rem;
	color: var(--wd-state-text);
	font-size: 1.25rem;
	line-height: 1.3;
}

.wifidog-state-copy > p {
	margin: 0;
	line-height: 1.5;
}

.wifidog-status-grid {
	display: grid;
	grid-template-columns: repeat(3, minmax(0, 1fr));
	gap: .65rem;
	margin-top: .9rem;
	padding-top: .85rem;
	border-top: 1px solid var(--wd-border);
}

.wifidog-status-item {
	display: grid;
	gap: .45rem;
	min-height: 4rem;
	padding: .75rem;
	border: 1px solid var(--wd-border);
	border-radius: .5rem;
	background: var(--wd-surface);
}

.wifidog-status-label {
	color: var(--wd-muted);
	font-size: .76rem;
	font-weight: 600;
}

.wifidog-status-item .wifidog-badge {
	justify-self: start;
}

/* Keep the native CBI form while matching the lighter operational pages. */
