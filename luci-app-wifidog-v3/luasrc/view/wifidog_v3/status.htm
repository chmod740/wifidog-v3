<%
local csrf_token = select(2, pcall(function() return luci.dispatcher.context.requesttoken end)) or select(2, pcall(function() return luci.dispatcher.context.token end)) or ''
local script = [[
<script>
var statusUrl = ']] .. luci.dispatcher.build_url("admin/services/wifidog_v3/status") .. [[';

function updateStatus() {
	var el = document.getElementById('wifidog_status');
	if (!el) return;

	fetch(statusUrl, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'token=' + ']] .. csrf_token .. [[' })
	.then(function(r) { return r.json(); })
	.then(function(data) {
		var html = '';
		if (data.enabled) {
			var nftOk = data.nft !== undefined ? data.nft : data.running;
			var portalOk = data.portal !== undefined ? data.portal : data.running;
			html += '<p><strong>]] .. translate("系统状态：") .. [[</strong> <span style="color:green;">]] .. translate("已启用") .. [[</span></p>';
			html += '<p><strong>]] .. translate("防火墙规则：") .. [[</strong> <span style="color:' + (nftOk ? 'green' : 'red') + ';">' + (nftOk ? ']] .. translate("运行中") .. [[' : ']] .. translate("未运行") .. [[') + '</span></p>';
			html += '<p><strong>]] .. translate("Portal服务：") .. [[</strong> <span style="color:' + (portalOk ? 'green' : 'red') + ';">' + (portalOk ? ']] .. translate("运行中") .. [[' : ']] .. translate("未运行") .. [[') + '</span></p>';
		} else {
			html += '<p><strong>]] .. translate("系统状态：") .. [[</strong> <span style="color:red;">]] .. translate("已禁用") .. [[</span></p>';
			html += '<p><em>]] .. translate("请在基本设置中启用系统") .. [[</em></p>';
		}
		el.innerHTML = html;
	})
	.catch(function() {
		var el = document.getElementById('wifidog_status');
		if (el) el.innerHTML = '<p style="color:red;">]] .. translate("无法获取状态信息") .. [[</p>';
	});
}

document.addEventListener('DOMContentLoaded', function() {
	updateStatus();
	setInterval(updateStatus, 5000);
});
</script>
]]
%>

<div id="wifidog_status">
	<p><em><%:正在获取状态信息...%></em></p>
</div>

<% write(script) %>
